<style>
  html,body{margin:0;height:100%;background:#0B1F33;overflow:hidden}
  #marco{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#0B1F33}
  body.con-ayuda #marco{bottom:44px;height:calc(100% - 44px - env(safe-area-inset-top,0px))}
  #ayuda{display:none;position:fixed;left:0;right:0;bottom:0;height:44px;padding-bottom:env(safe-area-inset-bottom,0px);background:#0B1F33;color:#DCE6EF;font:14px Arial,sans-serif;align-items:center;justify-content:center;gap:6px}
  body.con-ayuda #ayuda{display:flex}
  #ayuda a{color:#fff;font-weight:700}
</style>
</head>
<body>
<iframe id="marco" title="Proyectos Tejeda" allow="camera; microphone; geolocation; clipboard-write"
  src="https://script.google.com/macros/s/AKfycbylyiJY56mtLy7C1ECGpbH6cjVKE81AU40qe59gIPiIUe6kExSv1BbDa-jL9Q0GLFLW/exec"></iframe>
<div id="ayuda">¿No aparece tu cuenta? <a id="directo" target="_blank" rel="noopener"
  href="https://script.google.com/macros/s/AKfycbylyiJY56mtLy7C1ECGpbH6cjVKE81AU40qe59gIPiIUe6kExSv1BbDa-jL9Q0GLFLW/exec">Abrir directo</a></div>
<script src="sesion.js"></script>
<script>
window.instalarSesionCaldeher({
  iframe: document.getElementById('marco'),
  origenApp: 'https://n-tcm5xl2rihmm3iymht37z6pv54m2fzilis7awfi-0lu-script.googleusercontent.com',
  app: '1oRiFGXMoS3VpLuRtA9C'
});
</script>
<script>
// Portada sin datos ni secretos. Abre DATOS directo: entrada con correo + PIN; Google queda como respaldo (Puerta).
// Guarda aquí (primer partido) la sesión de 90 días del teléfono, vía sesion.js (puente con origen, ventana, app y nonce verificados).
// Sólo acepta el aviso «entrar» de los servidores de Google Apps Script, y sólo navega a una liga de Apps Script con pase.
(function () {
  var ORIGEN_OK = /^https:\/\/([a-z0-9-]+-script\.googleusercontent\.com|script\.google\.com)$/;
  var ENLACE_OK = /^https:\/\/script\.google\.com\/(a\/macros\/[a-z0-9.-]+|macros)\/s\/[A-Za-z0-9_-]+\/exec\?([A-Za-z0-9_=-]+&)*pase=[A-Za-z0-9_.%-]+$/;
  var marco = document.getElementById('marco');
  window.addEventListener('message', function (ev) {
    if (!ORIGEN_OK.test(ev.origin)) return;
    var d = ev.data;
    if (!d || d.tipo !== 'caldeher-entrar' || typeof d.enlace !== 'string' || !ENLACE_OK.test(d.enlace)) return;
    marco.src = d.enlace;
    document.body.classList.remove('con-ayuda');
  });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
