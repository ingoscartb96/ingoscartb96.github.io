<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Obra Tejeda</title>
<meta name="theme-color" content="#0B1F33">
<meta name="description" content="Control de obra de Constructora Tejeda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Control Obra">
<style>
  html,body{margin:0;height:100%;background:#0B1F33;overflow:hidden}
  #marco{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#f3f4f6}
  body.con-ayuda #marco{bottom:44px;height:calc(100% - 44px - env(safe-area-inset-top,0px))}
  #ayuda{display:none;position:fixed;left:0;right:0;bottom:0;height:44px;padding-bottom:env(safe-area-inset-bottom,0px);background:#0B1F33;color:#DCE6EF;font:14px Arial,sans-serif;align-items:center;justify-content:center;gap:6px}
  body.con-ayuda #ayuda{display:flex}
  #ayuda a{color:#fff;font-weight:700}
</style>
</head>
<body class="con-ayuda">
<iframe id="marco" title="Control de Obra Tejeda" allow="camera; microphone; geolocation; clipboard-write"
  src="https://script.google.com/macros/s/AKfycbyc1wCIKRldG1n6AH2xw5_RXlz5UYs2AvgSD9J35VJm1LVrnKOXceQKM8gDShX05Ps/exec?enmarco=1"></iframe>
<div id="ayuda">¿No aparece tu cuenta? <a id="directo" target="_blank" rel="noopener"
  href="https://script.google.com/macros/s/AKfycbyc1wCIKRldG1n6AH2xw5_RXlz5UYs2AvgSD9J35VJm1LVrnKOXceQKM8gDShX05Ps/exec">Abrir directo</a></div>
<script>
// Portada sin datos ni secretos. La identidad y los permisos los sigue dando Google (Puerta y DATOS).
// Sólo acepta el aviso «entrar» de los servidores de Google Apps Script, y sólo navega a una liga de Apps Script con pase.
(function () {
  var ORIGEN_OK = /^https:\/\/([a-z0-9-]+-script\.googleusercontent\.com|script\.google\.com)$/;
  var ENLACE_OK = /^https:\/\/script\.google\.com\/(a\/macros\/[a-z0-9.-]+|macros)\/s\/[A-Za-z0-9_-]+\/exec\?([A-Za-z0-9_=-]+&)*pase=[A-Za-z0-9_.%-]+$/;
  var marco = document.getElementById('marco');
  window.addEventListener('message', function (ev) {
    if (!ORIGEN_OK.test(ev.origin)) return;
    var d = ev.data;
    if (!d || d.tipo !== 'caldeher-entrar' || typeof d.enlace !== 'string' || !ENLACE_OK.test(d.enlace)) return;
    marco.src = d.enlace;
    document.body.classList.remove('con-ayuda');
  });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
</html>
